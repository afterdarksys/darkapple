[package]
name = "darkapple"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
license = "UNLICENSED"
description = "Continuous macOS sensor for the After Dark ecosystem"

[dependencies]
libc = "0.2.188"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
hex = "0.4.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
lto = "thin"
strip = "symbols"

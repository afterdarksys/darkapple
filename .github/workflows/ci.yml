name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Formatting
        run: rustup run 1.97.1 cargo fmt --check
      - name: Clippy
        run: rustup run 1.97.1 cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Tests
        run: rustup run 1.97.1 cargo test --locked
      - name: Swift typecheck and Endpoint Security-free output test (no signing)
        run: bash scripts/test-swift.sh
      - name: Install pinned cargo-auditable
        run: |
          rustup run 1.97.1 cargo install cargo-auditable --version 0.7.6 --locked
          rustup run 1.97.1 cargo install rust-audit-info --version 0.5.4 --locked
      - name: Release build
        run: rustup run 1.97.1 cargo auditable build --locked --release
      - name: Confirm the embedded crate list
        run: bash scripts/auditable-root.sh darkapple target/release/darkapple

  dependency-policy:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install pinned cargo-deny
        run: rustup run 1.97.1 cargo install cargo-deny --version 0.20.2 --locked
      - name: Advisory, license, ban and source policy
        run: cargo deny check

  secret-scan:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Install pinned gitleaks (verified by the Go checksum database)
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Secret scan of the full history
        run: gitleaks git --redact --exit-code 1 .
